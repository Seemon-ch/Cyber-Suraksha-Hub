<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kavach-AI</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <svg width="28" height="32" viewBox="0 0 100 120" aria-hidden="true">
          <path
            d="M50 4 92 20v38c0 30-20 50-42 58C28 108 8 88 8 58V20Z"
            fill="currentColor"
          /></svg
        >Kavach-AI
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button id="en" aria-pressed="true">EN</button
        ><button id="hi" aria-pressed="false">हिन्दी</button>
      </div>
    </header>
    <main>
      <h1 id="t1"></h1>
      <p class="sub" id="t2"></p>
      <textarea id="q" aria-label="Check anything"></textarea>
      <div class="row">
        <button class="go" id="go"></button><span class="tag" id="tryl"></span
        ><button class="chip" data-s="http://sbi-kyc-update.xyz/verify-now">
          SBI link</button
        ><button
          class="chip"
          data-s="Dear customer your account will be blocked in 24 hours. Share OTP now to avoid suspension."
        >
          SMS</button
        ><button class="chip" data-s="refund.support.4471@ybl">UPI ID</button
        ><button class="chip" data-s="asha@example.com">Email</button
        ><button class="chip" data-s="https://www.onlinesbi.sbi">
          Real SBI
        </button>
      </div>
      <div id="res" aria-live="polite">
        <svg
          class="shield"
          viewBox="0 0 100 120"
          role="img"
          aria-label="Risk score"
        >
          <defs>
            <clipPath id="cp">
              <path d="M50 4 92 20v38c0 30-20 50-42 58C28 108 8 88 8 58V20Z" />
            </clipPath>
          </defs>
          <path
            d="M50 4 92 20v38c0 30-20 50-42 58C28 108 8 88 8 58V20Z"
            fill="none"
            stroke="var(--ink)"
            stroke-width="4"
          />
          <rect
            id="fill"
            x="0"
            y="120"
            width="100"
            height="120"
            clip-path="url(#cp)"
            style="transition: y 0.9s cubic-bezier(0.2, 0.8, 0.2, 1)"
          />
          <text
            id="num"
            x="50"
            y="70"
            text-anchor="middle"
            style="
              font:
                800 30px Mukta,
                sans-serif;
              fill: #fff;
              paint-order: stroke;
              stroke: var(--ink);
              stroke-width: 3px;
            "
          ></text>
        </svg>
        <div>
          <p class="verdict" id="vd"></p>
          <span class="tag" id="ty"></span>
          <ul id="rs"></ul>
          <p class="adv" id="ad"></p>
        </div>
      </div>
      <section>
        <h2 id="h1"></h2>
        <div class="hist" id="hist"></div>
      </section>
      <section>
        <h2 id="h2"></h2>
        <p class="sub" id="gs"></p>
        <div class="gwrap">
          <svg
            id="g"
            viewBox="0 0 600 270"
            width="100%"
            style="min-width: 520px"
          ></svg>
        </div>
      </section>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
