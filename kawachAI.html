<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kavach-AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF1EC;--ink:#0F2F3A;--mute:#52666d;--card:#fff;--line:#cfd8d3;--safe:#1F8A5B;--warn:#B97A00;--bad:#C8372D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B21;--ink:#E6EEEA;--mute:#93a8ad;--card:#12282f;--line:#244049;--safe:#4CC38A;--warn:#E5B04A;--bad:#F06A5E}}
:root[data-theme="dark"]{--bg:#0B1B21;--ink:#E6EEEA;--mute:#93a8ad;--card:#12282f;--line:#244049;--safe:#4CC38A;--warn:#E5B04A;--bad:#F06A5E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Mukta,"Noto Sans Devanagari",system-ui,sans-serif}
main,header{max-width:880px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:18px;padding-bottom:6px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:22px}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;color:var(--ink);padding:5px 12px;font:inherit;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font-size:clamp(40px,8vw,68px);line-height:1.05;font-weight:800;margin:28px 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);max-width:46ch;margin:0 0 20px}
textarea{width:100%;min-height:96px;resize:vertical;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);padding:14px;font:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 26px;font:inherit;font-weight:800;cursor:pointer}
.chip{background:none;border:1.5px dashed var(--mute);color:var(--mute);border-radius:99px;padding:3px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--ink);color:var(--ink)}
#res{margin-top:28px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px;display:none;gap:24px;grid-template-columns:150px 1fr;align-items:center}
#res.on{display:grid}
.shield{width:150px;height:auto}
.verdict{font-size:32px;font-weight:800;margin:0}
.tag{display:inline-block;color:var(--mute);font-size:14px}
ul{padding-left:20px;margin:10px 0}
.adv{font-weight:600;margin:10px 0 0}
section{margin-top:40px}
h2{font-size:24px;margin:0 0 10px}
.hist{display:grid;gap:6px}
.h{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.h b{font-variant-numeric:tabular-nums}
.gwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
svg text{fill:var(--mute);font:13px Mukta,sans-serif}

@media(max-width:560px){#res{grid-template-columns:1fr;justify-items:start}}
</style></head>
<body>
<header>
 <div class="logo"><svg width="28" height="32" viewBox="0 0 100 120" aria-hidden="true"><path d="M50 4 92 20v38c0 30-20 50-42 58C28 108 8 88 8 58V20Z" fill="currentColor"/></svg>Kavach-AI</div>
 <div class="lang" role="group" aria-label="Language"><button id="en" aria-pressed="true">EN</button><button id="hi" aria-pressed="false">हिन्दी</button></div>
</header>
<main>
 <h1 id="t1"></h1>
 <p class="sub" id="t2"></p>
 <textarea id="q" aria-label="Check anything"></textarea>
 <div class="row"><button class="go" id="go"></button><span class="tag" id="tryl"></span><button class="chip" data-s="http://sbi-kyc-update.xyz/verify-now">SBI link</button><button class="chip" data-s="Dear customer your account will be blocked in 24 hours. Share OTP now to avoid suspension.">SMS</button><button class="chip" data-s="refund.support.4471@ybl">UPI ID</button><button class="chip" data-s="asha@example.com">Email</button><button class="chip" data-s="https://www.onlinesbi.sbi">Real SBI</button></div>
 <div id="res" aria-live="polite">
  <svg class="shield" viewBox="0 0 100 120" role="img" aria-label="Risk score"><defs><clipPath id="cp"><path d="M50 4 92 20v38c0 30-20 50-42 58C28 108 8 88 8 58V20Z"/></clipPath></defs>
   <path d="M50 4 92 20v38c0 30-20 50-42 58C28 108 8 88 8 58V20Z" fill="none" stroke="var(--ink)" stroke-width="4"/>
   <rect id="fill" x="0" y="120" width="100" height="120" clip-path="url(#cp)" style="transition:y .9s cubic-bezier(.2,.8,.2,1)"/>
   <text id="num" x="50" y="70" text-anchor="middle" style="font:800 30px Mukta,sans-serif;fill:#fff;paint-order:stroke;stroke:var(--ink);stroke-width:3px"></text></svg>
  <div><p class="verdict" id="vd"></p><span class="tag" id="ty"></span><ul id="rs"></ul><p class="adv" id="ad"></p></div>
 </div>
 <section><h2 id="h1"></h2><div class="hist" id="hist"></div></section>
 <section><h2 id="h2"></h2><p class="sub" id="gs"></p><div class="gwrap"><svg id="g" viewBox="0 0 600 270" width="100%" style="min-width:520px"></svg></div></section>
</main>
<script>
const T={en:{t1:"Is this safe?",t2:"Paste a link, SMS, UPI ID or email. Kavach checks it and explains the result in plain words.",ph:"Paste anything here…",go:"Check now",tryl:"Try:",v:{safe:"Looks safe",warn:"Be careful",bad:"Danger"},ty:{link:"Link",sms:"Message",upi:"UPI ID",email:"Email"},ad:{safe:"Looks fine, but never share your OTP or PIN with anyone.",warn:"Don’t enter any details. Confirm on the official app or website first.",bad:"Don’t click, pay or reply. Report it at cybercrime.gov.in or call 1930."},h1:"Your checks",h2:"Scam network",gs:"Reported scams that share a pattern are linked. Each new risky check joins a cluster.",empty:"Nothing checked yet. Paste something above.",cl:{kyc:"Fake bank KYC",refund:"Fake refund desk",other:"Other"},ft:"Demo build: checks run in your browser with simple rules and sample data. Real models plug in through the API. Report fraud: cybercrime.gov.in · 1930",
r:{ip:"Uses a raw IP address instead of a name",tld:"Domain ending is common on scam sites",brand:"Uses a bank or UPI brand name on an unofficial domain",hyph:"Many hyphens, a common lookalike trick",http:"No secure connection (http)",kw:"Pressure words like verify, KYC or refund",at:"Contains @ to hide the real address",urg:"Creates urgency or threatens to block your account",otp:"Asks for OTP, PIN or password",prize:"Promises a prize or reward",kycm:"Mentions KYC, PAN or Aadhaar",upikw:"ID looks like a fake support or refund desk",num:"Random number string in the ID",rep:"Matches an entry already reported by users",breach:"Hash prefix {x} found in the demo breach list",cleanb:"Hash prefix {x} not in the demo breach list",clean:"No warning signs found"}},
hi:{t1:"क्या यह सुरक्षित है?",t2:"कोई लिंक, SMS, UPI ID या ईमेल पेस्ट करें। कवच जाँचकर सरल भाषा में बताएगा।",ph:"यहाँ कुछ भी पेस्ट करें…",go:"अभी जाँचें",tryl:"आज़माएँ:",v:{safe:"सुरक्षित लगता है",warn:"सावधान रहें",bad:"खतरा"},ty:{link:"लिंक",sms:"संदेश",upi:"UPI ID",email:"ईमेल"},ad:{safe:"ठीक लगता है, फिर भी OTP या PIN किसी को न बताएँ।",warn:"कोई जानकारी न भरें। पहले आधिकारिक ऐप या वेबसाइट पर जाँच लें।",bad:"न क्लिक करें, न पैसे भेजें, न जवाब दें। cybercrime.gov.in पर या 1930 पर शिकायत करें।"},h1:"आपकी जाँचें",h2:"स्कैम नेटवर्क",gs:"एक जैसे पैटर्न वाले रिपोर्ट किए गए स्कैम आपस में जुड़े हैं। हर नई खतरनाक जाँच किसी समूह में जुड़ जाती है।",empty:"अभी कुछ नहीं जाँचा। ऊपर कुछ पेस्ट करें।",cl:{kyc:"नकली बैंक KYC",refund:"नकली रिफ़ंड डेस्क",other:"अन्य"},ft:"डेमो संस्करण: जाँच आपके ब्राउज़र में सरल नियमों और नमूना डेटा से चलती है। असली मॉडल API से जुड़ेंगे। धोखाधड़ी की शिकायत: cybercrime.gov.in · 1930",
r:{ip:"नाम की जगह सीधा IP पता इस्तेमाल हुआ है",tld:"ऐसा डोमेन अंत जो स्कैम साइटों में आम है",brand:"बैंक या UPI ब्रांड का नाम अनौपचारिक डोमेन पर इस्तेमाल हुआ है",hyph:"कई हाइफ़न, जो नकली साइटों की आम चाल है",http:"सुरक्षित कनेक्शन नहीं है (http)",kw:"वेरिफ़ाई, KYC, रिफ़ंड जैसे दबाव वाले शब्द",at:"असली पता छिपाने के लिए @ का इस्तेमाल",urg:"जल्दबाज़ी या खाता बंद होने का डर दिखाया गया है",otp:"OTP, PIN या पासवर्ड माँगा गया है",prize:"इनाम या लॉटरी का लालच दिया गया है",kycm:"KYC, PAN या आधार का ज़िक्र है",upikw:"यह ID नकली सपोर्ट या रिफ़ंड डेस्क जैसी लगती है",num:"ID में बेतरतीब अंक हैं",rep:"यह पहले से रिपोर्ट की गई एंट्री से मेल खाती है",breach:"हैश उपसर्ग {x} डेमो ब्रीच सूची में मिला",cleanb:"हैश उपसर्ग {x} डेमो ब्रीच सूची में नहीं है",clean:"कोई खतरे का संकेत नहीं मिला"}}};
const BR=["sbi","hdfc","icici","paytm","phonepe","gpay","axis","npci","uidai","irctc"],OFF=["sbi.co.in","onlinesbi.sbi","hdfcbank.com","icicibank.com","paytm.com","phonepe.com","axisbank.com","npci.org.in","uidai.gov.in","irctc.co.in"];
const REP=["sbi-kyc-update.xyz","hdfc-verify-kyc.top","icici-kyc-secure.click","refund.support.4471@ybl","care.paytm.help@ybl","gpay-refund-desk@axl"];
let lang="en",hist=[],last=null;
const $=i=>document.getElementById(i);
const host=s=>{try{return new URL(/^https?:/i.test(s)?s:"http://"+s).hostname.toLowerCase()}catch(e){return""}};
const kind=s=>/^[\w.\-]{2,}@[a-z]{2,}$/i.test(s)?"upi":/^\S+@\S+\.\S+$/.test(s)?"email":(!/\s/.test(s)&&/https?:\/\/|www\.|\.\w{2,}(\/|$)/i.test(s))?"link":"sms";
function sLink(s,r){const h=host(s);let p=0;
 if(/^\d+\.\d+\.\d+\.\d+$/.test(h)){p+=35;r.push("ip")}
 if(/\.(xyz|top|click|loan|icu|work|live|site|online)$/.test(h)){p+=25;r.push("tld")}
 if(BR.some(b=>h.includes(b))&&!OFF.some(o=>h===o||h.endsWith("."+o))){p+=40;r.push("brand")}
 if((h.match(/-/g)||[]).length>=2){p+=12;r.push("hyph")}
 if(/^http:/i.test(s)){p+=10;r.push("http")}
 if(/verify|kyc|update|secure|login|reward|claim|refund/i.test(s)){p+=15;r.push("kw")}
 if(s.includes("@")){p+=20;r.push("at")}
 return p}
async function analyse(s){const r=[],t=kind(s);let p=0;
 if(t==="link")p=sLink(s,r);
 else if(t==="sms"){if(/urgent|immediately|blocked|suspend|expire|24 hours/i.test(s)){p+=25;r.push("urg")}
  if(/otp|pin|cvv|password/i.test(s)){p+=35;r.push("otp")}
  if(/lottery|won|prize|reward|gift/i.test(s)){p+=25;r.push("prize")}
  if(/kyc|pan|aadhaar/i.test(s)){p+=15;r.push("kycm")}
  const u=s.match(/(https?:\/\/|www\.)\S+/i);if(u)p+=Math.round(sLink(u[0],r)*.8)}
 else if(t==="upi"){if(/refund|support|care|help|lottery|kyc|desk/i.test(s)){p+=45;r.push("upikw")}
  if(/\d{4,}/.test(s)){p+=15;r.push("num")}}
 else{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s.toLowerCase())),x=[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("").slice(0,5);
  if(parseInt(x[0],16)<6){p=72;r.push(["breach",x])}else{p=8;r.push(["cleanb",x])}}
 if(REP.some(e=>s.toLowerCase().includes(e))){p+=40;r.push("rep")}
 if(!r.length)r.push("clean");
 p=Math.min(97,p);if(!p)p=4;
 return{s,t,p,r,v:p<30?"safe":p<60?"warn":"bad"}}
function gang(o){const s=o.s.toLowerCase();return o.t==="upi"||/refund|paytm|phonepe|gpay/.test(s)?"refund":/kyc|sbi|hdfc|icici|axis/.test(s)?"kyc":"other"}
const col=v=>`var(--${v})`;
function show(o){last=o;const L=T[lang];$("res").classList.add("on");
 $("fill").setAttribute("fill",col(o.v));$("fill").style.y=(120-o.p*1.2)+"px";$("num").textContent=o.p+"%";
 $("vd").textContent=L.v[o.v];$("vd").style.color=col(o.v);$("ty").textContent=L.ty[o.t];
 $("rs").innerHTML=o.r.map(k=>{const[a,x]=Array.isArray(k)?k:[k];return"<li>"+L.r[a].replace("{x}",x||"")+"</li>"}).join("");
 $("ad").textContent=L.ad[o.v]}
function draw(){const L=T[lang];
 $("hist").innerHTML=hist.length?hist.map(o=>`<div class="h"><i class="dot" style="background:${col(o.v)}"></i><span title="${o.s.replace(/"/g,"&quot;")}">${o.s.replace(/</g,"&lt;")}</span><b>${o.p}%</b></div>`).join(""):`<p class="sub">${L.empty}</p>`;
 const C={kyc:[110,125],refund:[300,125],other:[490,125]},G={kyc:REP.slice(0,3),refund:REP.slice(3)},nw={};
 hist.filter(o=>o.v!=="safe").forEach(o=>{const g=gang(o);(G[g]=G[g]||[]).push(o.s);(nw[g]=nw[g]||new Set()).add(o.s)});
 let h="";Object.keys(C).forEach(g=>{const n=G[g]||[];if(!n.length)return;const[cx,cy]=C[g],pts=n.map((v,i)=>{const a=i/n.length*6.283-1.57;return[cx+(n.length>1?62*Math.cos(a):0),cy+(n.length>1?62*Math.sin(a):0),v]});
  pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length];if(a!==b)h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--line)" stroke-width="2"/>`});
  pts.forEach(a=>{const fresh=nw[g]&&nw[g].has(a[2]);h+=`<circle cx="${a[0]}" cy="${a[1]}" r="${fresh?11:8}" fill="${col("bad")}" ${fresh?'stroke="var(--ink)" stroke-width="3"':""}><title>${a[2].replace(/</g,"&lt;")}</title></circle>`});
  h+=`<text x="${cx}" y="248" text-anchor="middle">${L.cl[g]}</text>`});
 $("g").innerHTML=h}
function ui(){const L=T[lang];document.documentElement.lang=lang;
 ["t1","t2","h1","h2","gs"].forEach(k=>$(k).textContent=L[k]);
 $("q").placeholder=L.ph;$("go").textContent=L.go;$("tryl").textContent=L.tryl;
 $("en").setAttribute("aria-pressed",lang==="en");$("hi").setAttribute("aria-pressed",lang==="hi");
 if(last)show(last);draw()}
async function run(){const s=$("q").value.trim();if(!s)return;const o=await analyse(s);hist.unshift(o);hist=hist.slice(0,8);show(o);draw()}
$("go").onclick=run;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))run()});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.s;run()});
$("en").onclick=()=>{lang="en";ui()};$("hi").onclick=()=>{lang="hi";ui()};
ui();
</script></body></html>
